<!doctype html>
<html lang="de">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#A8442E" />
  <title>Seite nicht gefunden – Karteikasten</title>

  <style>
    :root {
      --bg: #F0E5C8;
      --ink: #241A10;
      --muted: #5c4a36;
      --line: #E3D6B2;
      --rust: #A8442E;
      --rust-ink: #FBF6EA;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1610;
        --ink: #F0E5C8;
        --muted: #bfae8d;
        --line: #2a2017;
        --rust: #C4573D;
        --rust-ink: #1d1610;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
      background-color: var(--bg);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 33px,
        var(--line) 33px,
        var(--line) 35px
      );
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    main {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.45);
    }

    .code {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      margin: 8px 0 0;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 26px;
      margin: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      margin-top: 10px;
      border-radius: 14px;
      background: var(--rust);
      color: var(--rust-ink);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      font-family: inherit;
    }

    a.btn:hover,
    a.btn:focus-visible {
      filter: brightness(1.08);
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
  </style>

  <script>
    // GitHub Pages SPA Redirect
    // /vokabeln/lernen -> /vokabeln/?kkp=lernen
    // keep = 1 für .../vokabeln/, 0 für eigene Domain im Root
    (function () {
      var keep = 1;
      var l = location;
      var seg = l.pathname.split("/");
      var base = seg.slice(0, 1 + keep).join("/") + "/";
      var rest = seg.slice(1 + keep).join("/");
      var q = l.search ? "&" + l.search.slice(1) : "";

      if (rest) {
        l.replace(
          l.origin + base + "?kkp=" + encodeURIComponent(rest) + q + l.hash
        );
      }
    })();
  </script>
</head>
